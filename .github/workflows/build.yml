name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          channel: stable

      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: flutter build apk --debug

      - name: Debug build output
        if: always()
        run: |
          echo "## Build directory listing" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find build -type f -name "*.apk" 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "No APK files found" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "build/app/outputs contents:" >> $GITHUB_STEP_SUMMARY
          find build/app/outputs -type f 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "directory missing" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Create Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find build -name "*.apk" -type f 2>/dev/null | head -1)
          echo "APK found: $APK"
          if [ -n "$APK" ]; then
            gh release delete v1.0.0 --yes --cleanup-tag 2>/dev/null || true
            gh release create v1.0.0 "$APK" \
              --title "Free Translator APK" \
              --notes "Free Translator - Offline ML Kit Translation App" \
              --prerelease
          else
            echo "NO APK FOUND"
            exit 1
          fi
