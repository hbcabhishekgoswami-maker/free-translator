name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          channel: stable

      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK (retry up to 3 times)
        run: |
          for i in 1 2 3; do
            echo "=== Attempt $i ==="
            flutter build apk --debug && break
            echo "Attempt $i failed, retrying..."
            rm -rf build/
            sleep 10
          done

      - name: Find and Release APK
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH=$(find build -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found!"
            echo "Build output:"
            find build/app/outputs -type f 2>/dev/null
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          gh release delete v1.0.0 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.0.0 "$APK_PATH" \
            --title "Free Translator APK" \
            --notes "Free Translator - Offline ML Kit Translation App. Download and install on your Android phone." \
            --prerelease
