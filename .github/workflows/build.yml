name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          channel: stable

      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: |
          for i in 1 2 3; do
            echo "=== Attempt $i ==="
            flutter build apk --debug && break || true
            sleep 5
          done

      - name: Find APK and Create Release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Searching for APK files ==="
          find / -name "*.apk" -type f 2>/dev/null | grep -v ".gradle" | head -20
          echo "=== Build dir ==="
          ls -laR build/app/outputs/ 2>/dev/null || echo "no build/app/outputs"
          echo "=== Home build dir ==="
          ls -laR ~/build/ 2>/dev/null || echo "no ~/build"
          echo "=== Flutter build output ==="
          ls -laR .dart_tool/ 2>/dev/null | head -5

          APK=$(find / -name "app-debug.apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(find build -name "*.apk" -type f 2>/dev/null | head -1)
          fi
          if [ -z "$APK" ]; then
            APK=$(find /home -name "*.apk" -type f 2>/dev/null | head -1)
          fi
          if [ -z "$APK" ]; then
            APK=$(find /tmp -name "*.apk" -type f 2>/dev/null | head -1)
          fi

          echo "FINAL APK: $APK"
          if [ -n "$APK" ]; then
            gh release delete v1.0.0 --yes --cleanup-tag 2>/dev/null || true
            gh release create v1.0.0 "$APK" \
              --title "Free Translator APK" \
              --notes "Free Translator - Offline ML Kit Translation App" \
              --prerelease
            echo "RELEASE CREATED!"
          else
            echo "NO APK FOUND ANYWHERE"
            exit 1
          fi
