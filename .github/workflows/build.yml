name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable

      - name: Build APK
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter build apk --release

      - name: Find and Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== SEARCHING APK ==="
          find build android -name "*.apk" -type f 2>/dev/null | head -10
          APK=$(find build android -name "*.apk" -type f 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" /tmp/FreeTranslator.apk
            ls -lh /tmp/FreeTranslator.apk
            gh release delete v1.0.0 --yes --cleanup-tag 2>/dev/null || true
            gh release create v1.0.0 /tmp/FreeTranslator.apk \
              --title "Free Translator APK" \
              --notes "Free Translator - Offline ML Kit Translation App" \
              --prerelease
            echo "RELEASE CREATED!"
            echo "DOWNLOAD: https://github.com/hbcabhishekgoswami-maker/free-translator/releases/download/v1.0.0/FreeTranslator.apk"
          else
            echo "NO APK FOUND"
            exit 1
          fi
