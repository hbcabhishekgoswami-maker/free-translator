name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          channel: stable

      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: flutter build apk --debug

      - name: Find APK
        run: |
          echo "=== Looking for APK ==="
          find build -name "*.apk" -type f 2>/dev/null
          echo "=== build/app/outputs contents ==="
          find build/app/outputs -type f 2>/dev/null || echo "directory not found"
          APK_PATH=$(find build -name "*.apk" -type f | head -1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "Found APK: $APK_PATH"

      - name: Create Release
        if: env.APK_PATH != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.0.0 "$APK_PATH" \
            --title "Free Translator APK" \
            --notes "Free Translator - Offline ML Kit Translation App. Download and install on your Android phone." \
            --prerelease
