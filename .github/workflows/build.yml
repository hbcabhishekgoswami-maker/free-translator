name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.27.4
          channel: stable

      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        id: buildapk
        continue-on-error: true
        run: flutter build apk --debug 2>&1 | tail -500 > /tmp/build.log; echo "OUTCOME=${{ steps.buildapk.outcome }}" || true

      - name: Create issue with build log on failure
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('/tmp/build.log', 'utf8'); } catch(e) { log = 'no log file found'; }
            const tail = log.split('\n').slice(-200).join('\n');
            
            // Close previous open "Build Error" issues
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'build-error'
            });
            for (const issue of issues.data) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Build Error Log',
              body: '```\n' + tail + '\n```',
              labels: ['build-error']
            });

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Free-Translator-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
