name: hi_translate
description: "Free Translator - Offline Multi-Language Translator"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ML Kit - Offline Translation & OCR (FREE, no API key needed)
  google_mlkit_translation: ^0.12.0
  google_mlkit_text_recognition: ^0.14.0

  # Speech (FREE, offline capable)
  speech_to_text: ^6.6.0
  flutter_tts: ^4.2.0

  # Camera & Image
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  image: ^4.5.2

  # File Handling
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  path: ^1.9.0

  # Local Storage (for history)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0

  # Utils
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
  assets:
    - assets/images/
